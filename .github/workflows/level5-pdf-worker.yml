name: Level 5 PDF controlled cleanup and branch publish
on:
  push:
    branches: ['ops/level5-pdf-audit-clean-20261104']
    paths: ['.github/workflows/level5-pdf-worker.yml']
permissions:
  contents: write
jobs:
  clean-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated Level 5 cleaner and Learning PDFs
        uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            public/Level 5/Learning
            scripts/pdf/level5_clean_verified.py
          sparse-checkout-cone-mode: false
          lfs: false
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested PDF libraries
        run: python -m pip install --quiet 'PyMuPDF==1.26.7' 'pypdf==5.9.0'
      - name: Clean and structurally verify all 51 Learning PDFs
        shell: bash
        run: |
          python scripts/pdf/level5_clean_verified.py \
            --root 'public/Level 5/Learning' \
            --out '/tmp/level5-cleansed/pdf' \
            --inter '/tmp/level5-cleansed/intermediate'
      - name: Publish ONLY Level 5 Learning PDFs to worker branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/level5-pdf-cleanup
          test "$(git rev-parse origin/main)" = 'b52b9cca94269e30d00024c87e746cec51a55234' || { echo 'Main changed; manual rebase required'; exit 1; }
          test "$(git rev-parse origin/fix/level5-pdf-cleanup)" = 'b52b9cca94269e30d00024c87e746cec51a55234' || { echo 'Worker branch changed; manual review required'; exit 1; }
          git switch -C level5-pdf-publish origin/fix/level5-pdf-cleanup
          cp -a '/tmp/level5-cleansed/pdf/.' 'public/Level 5/Learning/'
          git add -- 'public/Level 5/Learning/'
          python - <<'PY'
          import subprocess
          paths=[p for p in subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0') if p]
          assert len(paths)==51,('Expected exactly 51 changed PDF files',len(paths),paths)
          assert all(p.startswith('public/Level 5/Learning/') and p.endswith('.pdf') for p in paths),paths
          print('PASS: exactly 51 Level 5 Learning PDFs staged; no other files')
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'content(level5): clean branding and redundant Chinese in 51 Learning PDFs'
          git push origin HEAD:fix/level5-pdf-cleanup
          git log -1 --format='LEVEL5_PDF_COMMIT=%H'
      - name: Upload validation manifest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level5-pdf-clean-publish-report
          path: /tmp/level5-cleansed/level5-report.json
          retention-days: 7
