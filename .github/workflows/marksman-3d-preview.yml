name: Marksman 3D preview build
on:
  push:
    branches:
      - feat/marksman-3d-instruction-preview
  pull_request:
    paths:
      - "src/components/practical/Marksman3DPreview.tsx"
      - "src/components/practical/MarksmanMotorAssembly.tsx"
      - "src/components/practical/marksmanAssemblyGeometry.ts"
      - "scripts/verify-marksman-assets.mjs"
      - "src/routes/practical/**"
      - "package.json"
      - "bun.lock"
jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
      - name: Validate supplied 3D model geometry
        run: node scripts/verify-marksman-assets.mjs
      - name: Verify actual motor GLB runtime orientation
        run: node scripts/verify-marksman-motor-runtime.mjs
      - name: ESLint for assembly implementation (formatting excluded)
        run: >-
          npx eslint src/components/practical/MarksmanMotorAssembly.tsx
          src/components/practical/marksmanAssemblyGeometry.ts
          --rule "prettier/prettier: off"
