name: Level 6 clean remaining 35 Learning PDFs and validate all changes
on:
  push:
    branches:
      - fix/level6-pdf-cleanup
    paths:
      - .github/workflows/level6-pdf-clean-execute-20261104.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    if: github.ref == 'refs/heads/fix/level6-pdf-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout only assigned Level 6 Learning PDFs and PDF scripts
        uses: actions/checkout@v4
        with:
          ref: fix/level6-pdf-cleanup
          filter: blob:none
          sparse-checkout: |
            public/Level 6/Learning
            scripts/pdf
            .github/workflows
          sparse-checkout-cone-mode: true
          persist-credentials: true
          lfs: false
      - name: Validate exact branch and 43-PDF scope
        shell: bash
        run: |
          git rev-parse HEAD | tee /tmp/level6-start-sha
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('public/Level 6/Learning')
          files=sorted(root.rglob('*.pdf'))
          assert len(files)==43,('scope inventory',len(files))
          print('SCOPE_VERIFIED_LEVEL6_LEARNING_PDFS',len(files))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install safe PDF processing library
        run: python -m pip install --quiet 'PyMuPDF==1.26.7' 'Pillow>=10,<13'
      - name: Clean remaining 35 PDFs in temp directory without editing originals
        run: python scripts/pdf/clean_level6_learning_once.py
      - name: Check all 895 pages against untouched branch originals
        run: python scripts/pdf/validate_level6_cleaned.py
      - name: Generate visual before-and-after cover and closing review contacts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import fitz,json
          old=Path('public/Level 6/Learning')
          new=Path('/tmp/bsr-level6-cleaned')
          out=Path('/tmp/bsr-level6-proof');out.mkdir(parents=True,exist_ok=True)
          tiles=[]
          for newfile in sorted(new.rglob('*.pdf')):
              original=old/newfile.relative_to(new)
              a=fitz.open(original);b=fitz.open(newfile)
              for i in (0,len(a)-1):
                  before=a[i].get_pixmap(matrix=fitz.Matrix(.35,.35),alpha=False)
                  after=b[i].get_pixmap(matrix=fitz.Matrix(.35,.35),alpha=False)
                  if before.samples==after.samples:continue
                  tile=Image.new('RGB',(760,285),'white')
                  for pix,xoff in [(before,0),(after,380)]:
                      im=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
                      im.thumbnail((370,240))
                      tile.paste(im,(xoff+(380-im.width)//2,13))
                  ImageDraw.Draw(tile).text((7,258),newfile.parent.name[:42]+f' page {i+1}: before / after',fill='black')
                  tiles.append(tile)
              a.close();b.close()
          assert len(tiles)==26,('expected exactly 26 dark cover/closing changes',len(tiles))
          for start in range(0,len(tiles),8):
              sh=Image.new('RGB',(1520,1140),'#dddddd')
              for j,tile in enumerate(tiles[start:start+8]):
                  sh.paste(tile,((j%2)*760,(j//2)*285))
              sh.save(out/f'dark-cover-comparison-{start//8+1:02d}.jpg',quality=84,optimize=True)
          print('LEVEL6_VISUAL_PROOF',json.dumps({'edited_pages':len(tiles),'sheets':len(list(out.glob("*.jpg")))}))
          PY
      - name: Upload cleanup and complete QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level6-full-clean-895-page-validation
          path: |
            /tmp/bsr-level6-cleaned/cleanup-report.json
            /tmp/bsr-level6-cleaned/validation-report.json
            /tmp/bsr-level6-proof/
          retention-days: 21
          if-no-files-found: warn
      - name: Apply and push only 35 independently validated Level 6 Learning PDFs
        shell: bash
        run: |
          cp -a /tmp/bsr-level6-cleaned/. 'public/Level 6/Learning/'
          rm -f 'public/Level 6/Learning/cleanup-report.json' 'public/Level 6/Learning/validation-report.json'
          git add -- 'public/Level 6/Learning/'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          changed=[x.decode() for x in subprocess.check_output(
              ['git','diff','--cached','--name-only','-z']).split(b'\0') if x]
          assert len(changed)==35,('exact 35 remaining PDFs must be staged',len(changed),changed)
          assert all(p.startswith('public/Level 6/Learning/') and p.lower().endswith('.pdf') for p in changed),changed
          print('STAGED_SCOPE_PASS',len(changed),'Level 6 Learning PDFs')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content(level6): clean remaining 35 Learning PDFs preserving English and artwork'
          git fetch --no-tags --filter=blob:none origin fix/level6-pdf-cleanup
          test "$(git rev-parse origin/fix/level6-pdf-cleanup)" = "$(cat /tmp/level6-start-sha)" || {
            echo 'Remote Level 6 worker advanced during QA. No push performed; reconcile safely.' >&2
            exit 1
          }
          git push origin HEAD:fix/level6-pdf-cleanup
          git log -1 --format='LEVEL6_35_PDF_CLEAN_COMMIT=%H'
