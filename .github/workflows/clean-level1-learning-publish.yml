name: Publish cleaned Level 1 Learning PDFs to main
on:
  push:
    branches: [feat/level1-cleaned-learning-pdfs-20261102]
    paths: ['.github/workflows/clean-level1-learning-publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out isolated development branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true
      - name: Download any Git LFS Level 1 Learning PDFs
        shell: bash
        run: |
          git lfs pull --include="public/Level 1/Learning/**/*.pdf" --exclude="*.mp4,*.zip"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF cleanup libraries
        run: python -m pip install --quiet 'PyMuPDF==1.26.7' 'pypdf==6.4.0'
      - name: Normalize regex escaping from tool authoring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/pdf/clean_level1_learning_once.py")
          s=p.read_text()
          s=s.replace(chr(92)*2,chr(92))
          p.write_text(s)
          print("normalized regex escaping")
          PY
      - name: Clean and verify all 45 Level 1 Learning PDFs
        run: python scripts/pdf/clean_level1_learning_once.py
      - name: Publish only the verified Level 1 Learning PDFs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          out=Path("/tmp/bsr-level1-clean/output")
          pdfs=list(out.rglob("*.pdf"))
          assert len(pdfs)==45, len(pdfs)
          assert sum(len(fitz.open(p)) for p in pdfs)==852
          assert all(p.read_bytes().startswith(b'%PDF-') for p in pdfs)
          print("PASS: artifact pre-publish checks")
          PY
          git restore -- scripts/pdf/clean_level1_learning_once.py
          git fetch origin main
          git switch -C level1-pdf-publish origin/main
          cp -a /tmp/bsr-level1-clean/output/. "public/Level 1/Learning/"
          git add -- "public/Level 1/Learning"
          python - <<'PY'
          import subprocess
          from pathlib import Path
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip(chr(0)).split(chr(0))
          assert len(paths)==45, ('Expected 45 changed PDF paths',len(paths),paths)
          assert all(p.startswith('public/Level 1/Learning/') and p.endswith('.pdf') for p in paths),paths
          print("PASS: exactly 45 Level 1 Learning PDF changes; no other paths")
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "content(level1): replace 45 Learning PDFs with reviewed clean editions"
          git push origin HEAD:main
          git log -1 --format='PUBLISHED_COMMIT=%H'
