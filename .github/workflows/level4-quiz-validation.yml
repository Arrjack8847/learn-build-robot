name: Level 4 Quiz Studio validation

on:
  pull_request:
    paths:
      - "src/data/quizStudio.ts"
      - "src/data/quizBanks/level4/**"
      - "src/data/quizBanks/acousticControlLamp.ts"
      - "src/data/quizBanks/timidMouse.ts"
      - "tests/quiz-level4-coverage.test.mjs"
      - ".github/workflows/level4-quiz-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiz-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Acceleration Car and Level 4 quiz tests
        run: node --test tests/quiz-studio.test.mjs tests/quiz-level4-coverage.test.mjs
      - name: Build application with the 35 published Level 4 quizzes
        run: npm run build
      - name: Extract all 56 official Level 4 Learning PDFs for the 21 pending banks
        run: node scripts/extract-quiz-slides.mjs --level 4 --limit 56 --local-only
      - name: Save extracted slide text for source-driven question authoring
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level4-learning-slide-research
          path: quiz-research/*.json
          if-no-files-found: warn
          retention-days: 14
