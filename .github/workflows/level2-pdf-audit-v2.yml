name: Level 2 PDF isolated read-only audit
on:
  push:
    branches:
      - fix/level2-pdf-cleanup
    paths:
      - .github/workflows/level2-pdf-audit-v2.yml
permissions:
  contents: write
jobs:
  inspect:
    if: github.ref == 'refs/heads/fix/level2-pdf-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/Level 2/Learning
            .github/workflows
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Install audit requirements
        run: python -m pip install --quiet pymupdf pillow
      - name: Audit PDF texts, images, and visual contacts
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,json,re,pymupdf as fitz,io,hashlib,collections
          from PIL import Image,ImageDraw
          root=pathlib.Path("public/Level 2/Learning")
          out=pathlib.Path("qa/level2/read-only-audit")
          out.mkdir(parents=True,exist_ok=True)
          all_paths=sorted(root.rglob("*.pdf"))
          report={"files":[],"errors":[],"count_all":len(all_paths),"eligible_count":0,"excluded_building":[],"total_pages":0,"eligible_pages":0,"branding_files":0,"chinese_files":0}
          images=collections.defaultdict(lambda: {"occurrences":0,"files":set(),"page_refs":[],"size":0,"dims":[]})
          contacts=[]
          for path in all_paths:
            pathstring=path.as_posix()
            excluded="building" in path.name.lower()
            if excluded: report["excluded_building"].append(pathstring)
            info={"path":pathstring,"excluded_building":excluded,"size_bytes":path.stat().st_size,"chinese_pages":[],"branding_pages":[],"font_names":[],"errors":[],"images":[],"page_render_error":[]}
            try:
              doc=fitz.open(path)
              info["pages"]=len(doc)
              info["page_sizes"]=[[round(doc[i].rect.width,1),round(doc[i].rect.height,1)] for i in [0,len(doc)-1]] if len(doc)>0 else []
              info["needs_pass"]=bool(doc.needs_pass)
              info["is_repaired"]=bool(doc.is_repaired)
              info["font_names"]=sorted(set(font[3] for page in doc for font in page.get_fonts()))
              report["total_pages"]+=len(doc)
              if not excluded: report["eligible_pages"]+=len(doc)
              for pi,page in enumerate(doc):
                txt=page.get_text()
                matches=re.findall(r"[\u3400-\u9fff]",txt)
                brands=[s for s in ["intelligent storm","intelligence storm","智能风暴","智力风暴","zmrobo"] if s in txt.casefold()]
                if matches: info["chinese_pages"].append({"page":pi+1,"chars":len(matches),"lines":[x[:130] for x in txt.splitlines() if re.search(r"[\u3400-\u9fff]",x)][:12]})
                if brands: info["branding_pages"].append({"page":pi+1,"matches":brands,"lines":[x[:150] for x in txt.splitlines() if any(b in x.casefold() for b in brands)][:12]})
                for i in page.get_images(full=True):
                  xref=int(i[0])
                  try:
                    im=doc.extract_image(xref)
                    dig=hashlib.sha256(im["image"]).hexdigest()[:20]
                    d=images[dig];d["occurrences"]+=1;d["files"].add(pathstring);d["size"]=len(im["image"])
                    d["dims"]=[im["width"],im["height"]]
                    if len(d["page_refs"])<8:d["page_refs"].append([path.name,pi+1,xref])
                    info["images"].append([pi+1,dig])
                  except Exception as e:info["errors"].append("image extraction "+str(e))
              for pi in sorted(set([0,max(0,len(doc)-1)])):
                try:
                  pix=doc[pi].get_pixmap(matrix=fitz.Matrix(.64,.64),alpha=False)
                  im=Image.open(io.BytesIO(pix.tobytes("png"))).convert("RGB")
                  im.thumbnail((380,220))
                  tile=Image.new("RGB",(400,260),"white")
                  tile.paste(im,((400-im.width)//2,5))
                  ImageDraw.Draw(tile).text((8,232),f"{len(report['files'])+1:02d} {path.stem[:34]} - page {pi+1}",fill="black")
                  contacts.append(tile)
                except Exception as e:info["page_render_error"].append(f"p{pi+1}: {e}")
              if not excluded:
                report["eligible_count"]+=1
                report["chinese_files"]+=bool(info["chinese_pages"])
                report["branding_files"]+=bool(info["branding_pages"])
            except Exception as e:
              info["errors"].append(type(e).__name__+": "+str(e))
              report["errors"].append([pathstring,str(e)])
            report["files"].append(info)
          report["image_signatures"]=[{"digest":k,"occurrences":v["occurrences"],"files":len(v["files"]),"size":v["size"],"dims":v["dims"],"sample":v["page_refs"]} for k,v in sorted(images.items(),key=lambda x:-x[1]["occurrences"])[:80]]
          for start in range(0,len(contacts),16):
            sheet=Image.new("RGB",(1600,1040),"#ddd")
            for i,tile in enumerate(contacts[start:start+16]):sheet.paste(tile,((i%4)*400,(i//4)*260))
            sheet.save(out/f"contact-{start//16+1:02d}.jpg",quality=82,optimize=True)
          (out/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("LEVEL2_AUDIT_SUMMARY",json.dumps({k:v for k,v in report.items() if k not in ("files","image_signatures")},ensure_ascii=False))
          print("TOP_IMAGE_SIGNATURES",json.dumps(report["image_signatures"][:16]))
          assert not report["errors"],report["errors"]
          assert report["count_all"]==44,report["count_all"]
          PY
      - name: Publish audit to dedicated QA branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f --sparse qa/level2/read-only-audit/
          git commit -m "test(level2): read-only PDF audit and contact sheets"
          git push origin HEAD:refs/heads/tmp/level2-pdf-audit-20261104b
