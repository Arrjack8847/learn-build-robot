name: Level 2 English-preservation smoke tests

on:
  push:
    branches:
      - fix/level2-preserve-english-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated PDF test dependencies
        run: python -m pip install --disable-pip-version-check "pymupdf>=1.24,<1.27" "pillow>=10,<13" "numpy>=1.26,<3"
      - name: Parse scripts
        run: python -m py_compile scripts/pdf/clean_level2_learning_once.py scripts/pdf/validate_level2_cleaned.py scripts/pdf/test_level2_english_protection.py
      - name: Run synthetic cover and English-preservation regression tests
        run: python -m unittest discover -v -s scripts/pdf -p test_level2_english_protection.py
