name: Level 5 exhaustive browser QA all 51 Learning PDFs
on:
  push:
    branches: ['tmp/level5-integrated-premerge-qa-20261104']
    paths: ['.github/workflows/level5-all-learning-browser-qa.yml']
permissions:
  contents: read
jobs:
  browser-all-lessons:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD: "${{ matrix.shard }}"
      SHARDS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install application and Chromium
        run: |
          bun install --frozen-lockfile
          npm install --prefix /tmp/level5-browser --no-save playwright@1.58.2
          /tmp/level5-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Start Vite on localhost, no deployment
        shell: bash
        run: |
          set -euo pipefail
          nohup bun run dev --host 127.0.0.1 --port 4173 > /tmp/level5-all-browser-vite.log 2>&1 < /dev/null &
          ready=0
          for i in $(seq 1 70); do
            if curl --silent --max-time 2 --output /dev/null http://127.0.0.1:4173/; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/level5-all-browser-vite.log; exit 1; fi
      - name: Chromium full Level 5 PDF.js lesson audit (mobile)
        shell: bash
        run: |
          mkdir -p "/tmp/level5-browser-qa/shard-$SHARD"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from "node:fs";
          import assert from "node:assert/strict";
          import {createRequire} from "node:module";
          const require=createRequire("/tmp/level5-browser/package.json");
          const {chromium}=require("playwright");
          const host="http://127.0.0.1:4173";
          const shard=Number(process.env.SHARD),shards=Number(process.env.SHARDS);
          assert.ok(Number.isInteger(shard)&&shard>=0&&shard<shards);
          const source=readFileSync("src/data/levelFiveSixContent.ts","utf8");
          const registry=source.match(/export const levelFiveSixLessons: readonly AdvancedLessonAsset\[\] = (\[[\s\S]*?\]);/);
          assert.ok(registry,"Level 5 lesson registry not found");
          const all=JSON.parse(registry[1]).filter(x=>x.level===5);
          assert.equal(all.length,51);
          const lessons=all.filter((_,i)=>i%shards===shard);
          assert.equal(lessons.length,17);
          const browser=await chromium.launch({headless:true,args:["--no-sandbox"]});
          const passed=[],failed=[];
          let totalPages=0,ampersands=0;
          for(let i=0;i<lessons.length;i++){
            const lesson=lessons[i],width=[375,390,430][(shard+i)%3],height=844;
            let context=null;
            let timeoutHandle;
            const started=Date.now();
            try{
              context=await browser.newContext({
                viewport:{width,height},isMobile:true,hasTouch:true,deviceScaleFactor:1,
                serviceWorkers:"block"
              });
              const page=await context.newPage();
              page.setDefaultTimeout(20000);
              const pageErrors=[],pdfRequests=[],pdfResponses=[];
              page.on("pageerror",e=>pageErrors.push(e.message));
              page.on("request",r=>{if(r.url().includes("/Level%205/Learning/"))pdfRequests.push(r.url());});
              page.on("response",r=>{if(r.url().includes("/Level%205/Learning/"))pdfResponses.push({status:r.status(),url:r.url()});});
              const url=host+"/practical/"+encodeURIComponent(lesson.id)+"?mode=learning";
              const resp=await page.goto(url,{waitUntil:"domcontentloaded",timeout:30000});
              assert.ok(resp&&resp.ok(),"Router returned "+resp?.status());
              await page.getByText("Learning Studio",{exact:false}).first().waitFor({state:"visible",timeout:35000});
              const selector=page.getByLabel("Choose lecture slide");
              await selector.waitFor({state:"visible",timeout:35000});
              await page.waitForFunction(()=>{
                const s=document.querySelector('select[aria-label="Choose lecture slide"]')||document.querySelector('select');
                const c=document.querySelector('canvas[role="img"]');
                const indicator=Array.from(document.querySelectorAll('[role="alert"]')).map(x=>x.textContent).join(" ");
                return c&&c.width>100&&c.height>100&&c.getAttribute("aria-label")?.includes("slide 1") && !indicator.includes("Could not load");
              },null,{timeout:55000});
              await page.locator('[role="status"]').filter({hasText:"Rendering original PDF"}).waitFor({state:"hidden",timeout:55000});
              const count=await selector.locator("option").count();
              assert.ok(count>=2,"Unexpected slide count "+count);
              const firstPixels=await page.locator('canvas[role="img"]').first().evaluate(c=>({
                w:c.width,h:c.height,alpha:c.getContext("2d")?.getImageData(Math.floor(c.width/2),Math.floor(c.height/2),1,1)?.data[3]
              }));
              assert.ok(firstPixels.alpha>0,"Slide 1 canvas blank");
              await page.getByRole("button",{name:/^Next$/}).click();
              await page.waitForFunction(()=>{
                const c=document.querySelector('canvas[role="img"]');
                return c?.getAttribute("aria-label")?.includes("slide 2");
              },null,{timeout:30000});
              await page.locator('[role="status"]').filter({hasText:"Rendering original PDF"}).waitFor({state:"hidden",timeout:40000});
              const nextCanvas=await page.locator('canvas[role="img"]').first().evaluate(c=>({
                w:c.width,h:c.height,alpha:c.getContext("2d")?.getImageData(Math.floor(c.width/2),Math.floor(c.height/2),1,1)?.data[3]
              }));
              assert.ok(nextCanvas.alpha>0,"Slide 2 canvas blank");
              const actual=await selector.inputValue();
              assert.equal(actual,"2","Next button did not update selector");
              assert.equal(pageErrors.length,0,"Runtime errors: "+pageErrors.join("; "));
              assert.ok(pdfRequests.length>0,"No cleaned local PDF requested");
              assert.ok(pdfResponses.some(x=>x.status===200||x.status===206),"No successful PDF response");
              if(lesson.learningPdf.includes("&"))ampersands++;
              const record={id:lesson.id,width,pages:count,requests:pdfRequests.length,ms:Date.now()-started};
              totalPages+=count;
              passed.push(record);
              console.log("PASS_LESSON",JSON.stringify(record));
            }catch(err){
              const message=String(err?.stack??err);
              const record={id:lesson.id,width,message:message.slice(0,3500),ms:Date.now()-started};
              failed.push(record);
              console.error("FAIL_LESSON",JSON.stringify(record));
            }finally{
              if(context)await context.close().catch(()=>{});
            }
          }
          await browser.close();
          const report={shard,expected:lessons.length,passed:passed.length,failed:failed.length,ampersands,totalPages,passDetails:passed,failDetails:failed};
          writeFileSync("/tmp/level5-browser-qa/shard-"+shard+"/report.json",JSON.stringify(report,null,2));
          console.log("FINAL_RESULT",JSON.stringify({shard,passed:passed.length,failed:failed.length,ampersands,totalPages}));
          assert.equal(failed.length,0,"One or more Level 5 Learning studios failed browser QA");
          assert.equal(passed.length,17,"Missing browser coverage");
          JS
      - name: Upload browser QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level5-all-lessons-browser-shard-${{ matrix.shard }}
          path: /tmp/level5-browser-qa/shard-${{ matrix.shard }}/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show Vite console on failure
        if: failure()
        run: tail -120 /tmp/level5-all-browser-vite.log || true
