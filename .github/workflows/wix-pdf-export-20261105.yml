name: Export cleaned Learning PDFs to temporary Wix-transfer artifacts

on:
  push:
    branches:
      - chore/wix-pdf-export-20261105
    paths:
      - .github/workflows/wix-pdf-export-20261105.yml

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: "1"
            ref: "main"
            source: "public/Level 1/Learning"
            expected: "45"

    steps:
      - name: Fetch just this level's PDF source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          sparse-checkout: |
            ${{ matrix.source }}
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          lfs: false

      - name: Validate eligible PDF scope and stage files
        env:
          LEVEL: ${{ matrix.level }}
          SOURCE: ${{ matrix.source }}
          EXPECTED: ${{ matrix.expected }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          level=int(os.environ['LEVEL'])
          source=Path(os.environ['SOURCE'])
          expected=int(os.environ['EXPECTED'])
          assert source.exists(), f'Missing source: {source}'
          found=sorted(source.rglob('*.pdf'))
          if level==4:
              building=[p for p in found if p.relative_to(source).parts[0]=='Building']
              assert len(building)==50,len(building)
              found=[p for p in found if p not in building]
          if level==2:
              excluded=[p for p in found if '_building_' in p.name.lower()]
              assert len(excluded)==1 and excluded[0].name=='Double beam crane_Building_Powerpoint.pdf',excluded
              found=[p for p in found if p not in excluded]
          assert len(found)==expected, (level, len(found), expected)
          target=Path('wix-export')
          for item in found:
              output=target/item.relative_to(source)
              output.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(item,output)
              with output.open('rb') as stream:
                  assert stream.read(5)==b'%PDF-',item
          print('EXPORT_LEVEL',level,'PDF_COUNT',len(found),'BYTES',sum(p.stat().st_size for p in found),flush=True)
          PY

      - name: Publish short-lived cleaned PDF transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: wix-cleaned-level-${{ matrix.level }}
          path: wix-export/
          if-no-files-found: error
          compression-level: 6
          retention-days: 2
