name: Level 2 targeted PDF cleanup and full visual validation
on:
  push:
    branches:
      - fix/level2-pdf-cleanup
    paths:
      - .github/workflows/level2-pdf-clean-execute-20261104.yml
      - scripts/pdf/clean_level2_learning_once.py
      - scripts/pdf/validate_level2_cleaned.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Level 2 files and scoped tools, never another level
        uses: actions/checkout@v4
        with:
          ref: fix/level2-pdf-cleanup
          filter: blob:none
          sparse-checkout: |
            public/Level 2/Learning
            scripts/pdf
            .github/workflows
          sparse-checkout-cone-mode: true
          persist-credentials: true
      - name: Verify untouched originals and record target ref
        shell: bash
        run: |
          git rev-parse HEAD | tee /tmp/level2-start-sha
          git status --porcelain
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin main
          test -z "$(git diff --name-only origin/main HEAD -- 'public/Level 2/Learning/')"
          python3 - <<'PY'
          from pathlib import Path
          base=Path("public/Level 2/Learning")
          files=sorted(base.rglob("*.pdf"))
          excluded=[p for p in files if "_building_" in p.name.lower()]
          assert len(files)==44, len(files)
          assert len(excluded)==1 and excluded[0].name=="Double beam crane_Building_Powerpoint.pdf",excluded
          print("SCOPE_OK",len(files),"total",len(files)-len(excluded),"learning",len(excluded),"building fallback excluded")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF libraries
        run: python3 -m pip install --quiet 'PyMuPDF==1.26.7' 'pypdf==6.4.0' pillow
      - name: Test 4 representative source styles and validate BEFORE edits
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("level2_clean","scripts/pdf/clean_level2_learning_once.py")
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          sources=sorted(p for p in mod.ROOT.rglob("*.pdf") if "_building_" not in p.name.lower())
          for name in ["Axe robot_Powerpoint.pdf","Automatic window.pdf",
                       "Mechanical dog_PowerPoint-R.pdf","13.Teeterboard_PowerPoint.pdf"]:
              src=next(p for p in sources if p.name==name)
              print("SAMPLE",mod.process(src),flush=True)
          PY
          python3 scripts/pdf/validate_level2_cleaned.py --mode sample
      - name: Clean all 43 eligible Learning PDFs only
        run: python3 scripts/pdf/clean_level2_learning_once.py
      - name: Full baseline-vs-clean validation and render comparison
        run: python3 scripts/pdf/validate_level2_cleaned.py --mode full
      - name: Create every-modified-page visual comparison contact sheets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import fitz,io,json
          from PIL import Image,ImageChops,ImageDraw
          root=Path("public/Level 2/Learning")
          edited=Path("/tmp/bsr-level2-clean/output")
          out=Path("/tmp/bsr-level2-proof/all-changed-page-contacts");out.mkdir(parents=True,exist_ok=True)
          tiles=[];changed=0;pages=0
          for file in sorted(root.rglob("*.pdf")):
              if "_building_" in file.name.lower():continue
              new=edited/file.relative_to(root)
              a=fitz.open(file);b=fitz.open(new)
              assert len(a)==len(b)
              for i,(old,clean) in enumerate(zip(a,b)):
                  pages+=1
                  def snap(page):
                      p=page.get_pixmap(matrix=fitz.Matrix(.35,.35),alpha=False)
                      return Image.frombytes("RGB",(p.width,p.height),p.samples)
                  x=snap(old);y=snap(clean)
                  d=ImageChops.difference(x,y)
                  if not d.getbbox():continue
                  changed+=1
                  x.thumbnail((325,215));y.thumbnail((325,215))
                  tile=Image.new("RGB",(680,260),"white")
                  tile.paste(x,((330-x.width)//2,30))
                  tile.paste(y,(340+(330-y.width)//2,30))
                  dd=ImageDraw.Draw(tile)
                  dd.text((5,5),f"{file.stem[:44]} p{i+1} BEFORE / AFTER",fill="black")
                  tiles.append(tile)
              a.close();b.close()
          for st in range(0,len(tiles),12):
              sheet=Image.new("RGB",(1360,1560),"#dddddd")
              for j,tile in enumerate(tiles[st:st+12]):
                  sheet.paste(tile,((j%2)*680,(j//2)*260))
              sheet.save(out/f"changed-{st//12+1:02d}.jpg",quality=78,optimize=True)
          print("FULL_VISUAL_CONTACTS",json.dumps({"eligible_pages":pages,"visibly_changed_pages":changed,"sheets":len(list(out.glob("*.jpg")))}))
          assert pages==787,pages
          PY
      - name: Verify original website PDF URLs serve edited results
        shell: bash
        run: |
          cp -a /tmp/bsr-level2-clean/output/. 'public/Level 2/Learning/'
          python3 -m http.server 8765 --directory public >/tmp/level2-http.log 2>&1 &
          server=$!
          sleep 2
          python3 - <<'PY'
          from urllib.request import urlopen
          from urllib.parse import quote
          from pathlib import Path
          files=sorted(p for p in Path("public/Level 2/Learning").rglob("*.pdf") if "_building_" not in p.name.lower())
          assert len(files)==43
          for p in files:
              url="http://127.0.0.1:8765/"+quote(p.relative_to("public").as_posix(),safe="/")
              with urlopen(url,timeout=12) as resp:
                  assert resp.status==200 and resp.read(5)==b"%PDF-",p
          print("HTTP_PATH_QA_PASS",len(files))
          PY
          kill "$server"
      - name: Upload full validation and visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level2-full-clean-qa-and-visual-contact-sheets
          path: |
            /tmp/bsr-level2-proof/
            /tmp/bsr-level2-clean/report.json
          retention-days: 21
          if-no-files-found: warn
      - name: Commit and push only verified Level 2 PDFs, no merges
        shell: bash
        run: |
          git add -- 'public/Level 2/Learning/'
          python3 - <<'PY'
          import subprocess
          paths=[x.decode() for x in subprocess.check_output(["git","diff","--cached","--name-only","-z"]).split(b"\0") if x]
          assert len(paths)==43,("Must update exactly 43 Learning PDFs",len(paths),paths)
          assert all(p.startswith("public/Level 2/Learning/") and p.lower().endswith(".pdf") and "_building_" not in p.lower() for p in paths),paths
          print("COMMIT_SCOPE_PASS",len(paths),"PDFs")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'content(level2): clean 43 Learning PDFs and preserve diagrams'
          git fetch --no-tags --filter=blob:none origin fix/level2-pdf-cleanup
          if [ "$(git rev-parse origin/fix/level2-pdf-cleanup)" != "$(cat /tmp/level2-start-sha)" ]; then
            echo 'Remote branch advanced during audit; require safe rebase without overlapping PDF changes'
            test -z "$(git diff --name-only "$(cat /tmp/level2-start-sha)" origin/fix/level2-pdf-cleanup -- 'public/Level 2/Learning/')"
            git rebase origin/fix/level2-pdf-cleanup
          fi
          git push origin HEAD:fix/level2-pdf-cleanup
          git log -1 --format='FINAL_LEVEL2_PDF_COMMIT=%H'
