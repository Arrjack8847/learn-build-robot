name: Level 5 verification-only PDF export
on:
  push:
    branches: ['fix/level5-pdf-cleanup']
    paths: ['.github/workflows/level5-verification-export.yml']
permissions:
  contents: read
jobs:
  export-pdfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact cleaned Level 5 branch
        uses: actions/checkout@v4
        with:
          filter: blob:none
          lfs: false
      - name: Verify expected Level 5 Learning paths
        shell: bash
        run: |
          set -euo pipefail
          count=$(find 'public/Level 5/Learning' -type f -name '*.pdf' | wc -l)
          echo "Checked out $(git rev-parse HEAD), Level 5 Learning PDFs: $count"
          test "$count" -eq 51
      - name: Export verified cleaned PDF bytes for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: level5-branch-cleaned-pdfs-for-visual-inspection
          path: public/Level 5/Learning/**/*.pdf
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
