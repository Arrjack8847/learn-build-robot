name: Fix TanStack Start security dependency and Bun lockfile
on:
  push:
    branches: [fix/tanstack-start-security-20261102]
    paths: ['.github/workflows/fix-tanstack-start-dependency.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dependency-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            package.json
            bun.lock
            .github/workflows/fix-tanstack-start-dependency.yml
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.23'
      - name: Upgrade patched TanStack Start and lockfile
        shell: bash
        run: |
          bun add --exact '@tanstack/react-start@1.168.60'
          bun install --frozen-lockfile
      - name: Verify patched package graph
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=fs.readFileSync('bun.lock','utf8');
          if(pkg.dependencies['@tanstack/react-start']!=='1.168.60') throw Error('Incorrect direct dependency');
          if(!lock.includes('"@tanstack/react-start": "1.168.60"')) throw Error('Manifest/lock mismatch');
          const matches=lock.split('\n').filter(s=>s.trim().startsWith('"@tanstack/start-server-core": ['));
          if(!matches.length)throw Error('Missing start-server-core lock entry');
          const versions=matches.map(line=>line.split('start-server-core@')[1]?.split('"')[0]);
          function safe(v){if(!v)return false;const a=v.split('.').map(Number),b=[1,169,39];for(let i=0;i<3;i++){if(a[i]!==b[i])return a[i]>b[i]}return true;}
          if(!versions.every(safe))throw Error('Vulnerable start-server-core remains: '+versions.join(','));
          console.log('PASS: react-start',pkg.dependencies['@tanstack/react-start'],'start-server-core',versions.join(','));
          NODE
          git diff --check
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','-z']).decode().strip(chr(0)).split(chr(0))
          assert changed and set(changed)<= {'package.json','bun.lock'},changed
          assert 'package.json' in changed and 'bun.lock' in changed,changed
          print('PASS changed files only package.json and bun.lock')
          PY
      - name: Commit and push isolated fix branch
        shell: bash
        run: |
          git add package.json bun.lock
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "fix(security): upgrade TanStack Start to patched version"
          git push origin HEAD:fix/tanstack-start-security-20261102
          git rev-parse HEAD
