name: Level 5 cross-level baseline comparison (unchanged main)
on:
  push:
    branches: ['tmp/level5-integrated-premerge-qa-20261104']
    paths: ['.github/workflows/level5-main-baseline-regression.yml']
permissions:
  contents: read
jobs:
  unchanged-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout unchanged main, not Level 5 PRs
        uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          lfs: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install locked project dependencies
        run: bun install --frozen-lockfile
      - name: Run same full test suite as Level 5 combined branch
        shell: bash
        run: |
          set -euo pipefail
          git config core.quotePath false
          echo "BASELINE_SHA=$(git rev-parse HEAD)"
          echo "Test modules: $(find tests -maxdepth 1 -name '*.test.mjs' | wc -l)"
          node --test tests/*.test.mjs
      - name: Show exact source revision
        if: always()
        run: |
          git rev-parse HEAD
          git status --short
