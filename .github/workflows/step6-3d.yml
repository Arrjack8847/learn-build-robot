name: Marksmanship Step 6 3D connector beam
on:
  pull_request:
    paths:
      - "src/components/practical/StepSix*"
      - "src/routes/practical/**"
      - "tests/marksmanship-step6.test.mjs"
      - "docs/marksmanship-step6.md"
      - "src/components/practical/AssemblyLessonUI.tsx"
      - "tests/marksmanship-ui.test.mjs"
      - "package.json"
      - ".github/workflows/step6-3d.yml"
jobs:
  verify-step6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Step 6 attachment geometry and Step 5 handoff
        run: npm run test:step6
      - name: Step 5 regression checks
        run: npm run test:step5
      - name: Step 4 regression checks
        run: npm run test:step4
      - name: Shared lesson UI regression checks
        run: npm run test:ui
      - name: Production build
        run: npm run build
      - name: TypeScript validation
        run: npx tsc --noEmit
