name: Temporary Level 3 Footer Repair Sample
on:
  push:
    branches: [tmp/level3-pdf-cleanup-runner]
    paths: [.github/workflows/temp-level3-footer-sample.yml]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/level3-pdf-cleanup
          filter: blob:none
          sparse-checkout: |
            public/Level 3/Learning
      - run: python3 -m pip install --quiet pymupdf pillow numpy
      - name: Render a page-specific bitmap repair for review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import fitz, io, json, numpy as np
          from PIL import Image,ImageDraw
          p=sorted(Path('public/Level 3/Learning').rglob('*.pdf'))[10]
          doc=fitz.open(p)
          page=doc[-1]
          bg=next(x for x in page.get_images(full=True) if x[2]==1079 and x[3]==622)
          shared=[i+1 for i,pg in enumerate(doc) if any(x[0]==bg[0] for x in pg.get_images(full=True))]
          im=Image.open(io.BytesIO(doc.extract_image(bg[0])['image'])).convert('RGB')
          W,H=im.size
          print('SAMPLE',p,'original_image',im.size,'xref',bg[0],'shared_on_pages',shared)
          x0,y0=625,435
          width,height=W-x0,H-y0
          src=im.crop((120,y0,120+width,H))
          orig=im.crop((x0,y0,W,H))
          arr=np.asarray(src,dtype=np.float32)
          base=np.asarray(orig,dtype=np.float32)
          # Estimate color offset from the clean 14 rows above the footer to minimize seams.
          offset=np.median(base[:14].reshape(-1,3)-arr[:14].reshape(-1,3),axis=0)
          arr=np.clip(arr+offset,0,255)
          xx=np.arange(width)[None,:]
          yy=np.arange(height)[:,None]
          alpha=np.minimum(1,np.minimum(xx/20,yy/22))
          alpha=alpha[...,None]
          blended=np.clip(base*(1-alpha)+arr*alpha,0,255).astype(np.uint8)
          result=im.copy()
          result.paste(Image.fromarray(blended),(x0,y0))
          buf=io.BytesIO(); result.save(buf,format='PNG',optimize=True)
          before=page.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
          page.replace_image(bg[0],stream=buf.getvalue())
          tmp=Path('/tmp/level3-footer-sample.pdf');doc.save(tmp,garbage=4,deflate=True);doc.close()
          chk=fitz.open(tmp);after=chk[-1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
          assert before.width==after.width and before.height==after.height
          a=Image.frombytes('RGB',(before.width,before.height),before.samples)
          b=Image.frombytes('RGB',(after.width,after.height),after.samples)
          view=Image.new('RGB',(before.width*2,before.height+32),'white')
          view.paste(a,(0,32));view.paste(b,(before.width,32))
          ImageDraw.Draw(view).text((8,8),'ORIGINAL CLEANED / FOOTER REPAIR SAMPLE (same page)',fill='black')
          view.save('/tmp/level3-footer-before-after.png',optimize=True)
          pix_before=np.asarray(a);pix_after=np.asarray(b);diff=np.any(pix_before!=pix_after,axis=2)
          rect=page.get_image_rects(bg[0])[0]
          pdf_x=rect.x0+x0/W*rect.width
          pdf_y=rect.y0+y0/H*rect.height
          mask=np.zeros(diff.shape,bool);mask[max(0,int(pdf_y*1.5)-2):,max(0,int(pdf_x*1.5)-2):]=True
          print('DIFF',json.dumps({'outside_patch_changed_pixels':int(np.sum(diff&~mask)),'inside_patch_changed_pixels':int(np.sum(diff&mask)),'source_size':im.size,'docs_pages':len(chk)}))
          assert np.sum(diff&~mask)==0
          assert len(chk)==34
          chk.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: level3-footer-repair-sample
          path: |
            /tmp/level3-footer-before-after.png
            /tmp/level3-footer-sample.pdf
          retention-days: 14
