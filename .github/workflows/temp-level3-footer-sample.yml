name: Temporary Level 3 Footer Repair Sample
on:
  push:
    branches: [tmp/level3-pdf-cleanup-runner]
    paths: [.github/workflows/temp-level3-footer-sample.yml]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/level3-pdf-cleanup
          filter: blob:none
          sparse-checkout: |
            public/Level 3/Learning
      - run: python3 -m pip install --quiet pymupdf pillow numpy
      - name: Test page-only redaction and background restoration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import pymupdf as fitz, io, json, numpy as np
          from PIL import Image,ImageDraw
          p=sorted(Path('public/Level 3/Learning').rglob('*.pdf'))[10]
          doc=fitz.open(p)
          page=doc[-1]
          assert page.rect.width==720 and page.rect.height==405
          old2=doc[1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
          before=page.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
          pix=page.get_pixmap(matrix=fitz.Matrix(2,2),alpha=False)
          old=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
          target=(415,285,720,405)
          source=(60,285,365,405)
          src=old.crop(tuple(int(t*2) for t in source)).convert('RGBA')
          r,g,b,a=src.split()
          yy,xx=np.mgrid[0:src.height,0:src.width]
          mask=(255*np.minimum(1.,np.minimum(xx/30.,yy/30.))).astype(np.uint8)
          src.putalpha(Image.fromarray(mask,'L'))
          buffer=io.BytesIO();src.save(buffer,format='PNG')
          watermark=fitz.Rect(435,308,718,405)
          page.add_redact_annot(watermark,fill=False,cross_out=False)
          page.apply_redactions(images=fitz.PDF_REDACT_IMAGE_PIXELS,graphics=0,text=0)
          page.insert_image(fitz.Rect(*target),stream=buffer.getvalue(),overlay=True,keep_proportion=False)
          tmp=Path('/tmp/level3-footer-sample.pdf');doc.save(tmp,garbage=4,deflate=True);doc.close()
          chk=fitz.open(tmp)
          after=chk[-1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
          new2=chk[1].get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
          assert old2.samples==new2.samples,'Shared background slide 2 altered'
          assert before.width==after.width and before.height==after.height
          a=Image.frombytes('RGB',(before.width,before.height),before.samples)
          b=Image.frombytes('RGB',(after.width,after.height),after.samples)
          view=Image.new('RGB',(before.width*2,before.height+34),'white')
          view.paste(a,(0,34));view.paste(b,(before.width,34))
          ImageDraw.Draw(view).text((8,8),'CURRENT CLEANED PDF / FOOTER REPAIR SAMPLE - compare bottom-right',fill='black')
          view.save('/tmp/level3-footer-before-after.png',optimize=True)
          diff=np.any(np.asarray(a)!=np.asarray(b),axis=2)
          allowed=np.zeros(diff.shape,bool)
          allowed[int(285*1.5)-2:,int(415*1.5)-2:]=True
          unexpected=int(np.sum(diff&~allowed))
          print('SAMPLE',str(p),'page_count',len(chk),'unrelated_slide_2_unchanged',old2.samples==new2.samples,'changed_pixels_outside_patch',unexpected,flush=True)
          assert unexpected==0,('changed pixels outside footer',unexpected)
          assert len(chk)==34
          chk.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: level3-footer-repair-sample-v2
          path: |
            /tmp/level3-footer-before-after.png
            /tmp/level3-footer-sample.pdf
          retention-days: 14
