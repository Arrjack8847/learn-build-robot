name: Marksmanship photo-frame 3D checks

on:
  push:
    branches:
      - feat/marksman-photo-frame-tutorial-20261013
  pull_request:
    paths:
      - "src/components/practical/MarksmanFrameScene.tsx"
      - "src/components/practical/MarksmanFramePreparation.tsx"
      - "src/components/practical/marksmanFrameGeometry.ts"
      - "src/routes/practical/**"
      - "tests/marksmanship-frame.test.mjs"
      - ".github/workflows/marksmanship-frame.yml"

jobs:
  verify-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify frame and source STL geometry
        run: node --test tests/marksmanship-frame.test.mjs
      - name: Existing Step 3/4 regression tests
        run: |
          npm run test:step3
          npm run test:step4
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Check frame source lint
        run: >-
          npx eslint
          src/components/practical/MarksmanFrameScene.tsx
          src/components/practical/MarksmanFramePreparation.tsx
          src/components/practical/marksmanFrameGeometry.ts
          --rule "prettier/prettier: off"
      - name: Install browser QA tools
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile rendered 3D states
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/frame-vite.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && break
            sleep 2
          done
          node scripts/capture-marksman-step7.mjs
      - name: Upload 3D screenshots for PR review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marksman-frame-review-screenshots
          path: artifacts/marksman-step7/*.png
          if-no-files-found: warn
          retention-days: 14
