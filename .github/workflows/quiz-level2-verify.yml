name: Level 2 Quiz Studio verification and full PDF extraction
on:
  push:
    branches:
      - feat/quiz-level2-content
    paths:
      - 'src/data/quizBanks/level2/**'
      - 'src/data/quizStudio.ts'
      - 'tests/quiz-level2.test.mjs'
      - '.github/workflows/quiz-level2-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-level2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run original Quiz Studio tests and Level 2 coverage tests
        run: node --test tests/quiz-studio.test.mjs tests/quiz-level2.test.mjs
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Run existing student UI tests
        run: npm run test:ui
      - name: Build the application
        run: npm run build

  extract-all-sources:
    if: contains(github.event.head_commit.message, '[extract-level2]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Extract all 45 registered Level 2 Learning mappings using the existing script
        run: node scripts/extract-quiz-slides.mjs --level 2 --limit 45 --local-only
      - name: Extract all 15 Building-PDF Learning fallback sources
        run: node src/data/quizBanks/level2/extract-fallbacks.mjs
      - name: Install visual review utilities
        run: python -m pip install --no-cache-dir pymupdf pillow
      - name: Render every Level 2 source PDF into indexed contact sheets
        run: python src/data/quizBanks/level2/render-contact-sheets.py
      - name: Upload verified source research and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-level2-all-60-source-research
          path: |
            quiz-research/level-2-*.json
            quiz-research/level2-contact-sheets/*.jpg
            quiz-research/latest-extraction-summary.json
          retention-days: 14
          if-no-files-found: warn
