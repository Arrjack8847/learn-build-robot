name: Acceleration Car PDF viewer
on:
  push:
    branches:
      - feat/acceleration-car-pdf-viewer-20261020
  pull_request:
    paths:
      - 'src/components/practical/AccelerationCarPdfViewer.tsx'
      - 'src/components/practical/PdfManualPage.tsx'
      - 'src/data/accelerationCarManual.ts'
      - 'src/data/practical.ts'
      - 'src/routes/practical/**'
      - 'tests/acceleration-car-pdf-viewer.test.mjs'
      - 'package.json'
      - 'bun.lock'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Verify PDF pages and mapping
        run: node --test tests/acceleration-car-pdf-viewer.test.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
